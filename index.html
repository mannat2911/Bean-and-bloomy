<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bean & Bloom Café</title>

  <style>
    .slideshow {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}

.slide.active {
  opacity: 1;
}

.hero-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  text-align: center;
  background: rgba(0,0,0,.35);
  padding: 30px;
  border-radius: 20px;
}

.hero-text h2{
  font-size:50px;
  margin-bottom:10px;
}

.hero-text p{
  font-size:22px;
  margin-bottom:20px;
}

.hero-btn{
  display:inline-block;
  padding:14px 28px;
  background:#ff9fc0;
  color:white;
  text-decoration:none;
  border-radius:30px;
  font-weight:bold;
}

.hero-btn:hover{
  background:#ff7fa9;
}
  </style>
</head>
<body>
<header>
  <h1>🌸 Bean & Bloom</h1>
</header>

<div class="slideshow">

<img class="slide active" src="image1.png">
<img class="slide" src="image2.png">
<img class="slide" src="image3.png">
<img class="slide" src="image4.png">
<img class="slide" src="image5.png">

<div class="hero">
<h2>Bean & Bloom Café</h2>

<p>Coffee • Cakes • Cozy Moments</p>

<a href="#menu">Explore Menu</a>

</div>

</div>

<section id="menu">

<h2>Our Favourites</h2>

<div class="menu-item">
<h3>☕ Cappuccino</h3>
<p>Rich espresso with creamy milk foam.</p>
<strong>₹160</strong>
</div>

<div class="menu-item">
<h3>🍰 Brownie</h3>
<p>Freshly baked every morning.</p>
<strong>₹140</strong>
</div>

<div class="menu-item">
<h3>🧋 Cold Coffee</h3>
<p>Creamy and refreshing.</p>
<strong>₹180</strong>
</div>

</section>

<footer>
Made with ☕ & 🌸
</footer>

<script>

let slides=document.querySelectorAll(".slide");

let current=0;

setInterval(function(){

slides[current].classList.remove("active");

current=(current+1)%slides.length;

slides[current].classList.add("active");

},3000);

</script>
  

</body>
</html>
